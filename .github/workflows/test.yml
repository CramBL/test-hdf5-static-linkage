
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["trunk"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: debug

jobs:
    build-linux-musl:
        runs-on: ubuntu-latest
        env:
            RUSTFLAGS: "--codegen target-feature=+crt-static"
            TARGET: "x86_64-unknown-linux-musl"
        steps:
            - uses: actions/checkout@v4
            - name: Setup
              run: |
                rustup target add ${{ env.TARGET }}
                sudo apt-get update
                sudo apt-get install musl-tools

            - name: build without hdf5
              run: cargo build --target ${{ env.TARGET }}

            - name: Check linkage
              run: ldd target/${{ env.TARGET }}/debug/hdf5-static-linking
            
            - name: build WITH hdf5
              run: cargo build --target ${{ env.TARGET }} --features hdf5
            
            - name: Check linkage
              run: |
                ldd target/${{ env.TARGET }}/debug/hdf5-static-linking
                ldd target/${{ env.TARGET }}/debug/hdf5-static-linking | grep statically


    build-windows:
        runs-on: windows-latest
        env:
            RUSTFLAGS: "--codegen target-feature=+crt-static"
            TARGET: "x86_64-pc-windows-msvc"
        steps:
            - uses: actions/checkout@v4
            - name: build without hdf5
              run: cargo build --target ${{ env.TARGET }}
            
            - name: Check linkage
              shell: bash
              run: ldd target/${{ env.TARGET }}/debug/hdf5-static-linking.exe
            
            - name: build WITH hdf5
              run: cargo build --target ${{ env.TARGET }} --features hdf5
            
            - name: Check linkage
              shell: bash
              run: |
                ldd target/${{ env.TARGET }}/debug/hdf5-static-linking.exe
                ldd target/${{ env.TARGET }}/debug/hdf5-static-linking.exe | grep --invert-match hdf5

    reproduce-windows-script:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Run build script
              shell: pwsh
              run: .\build_check_linkage.ps1

    build-windows-set-hdf5-dir:
        runs-on: windows-latest
        env:
            RUSTFLAGS: "--codegen target-feature=+crt-static"
            TARGET: "x86_64-pc-windows-msvc"
            HDF5_VERSION: "1.14.0"
        steps:
            - uses: actions/checkout@v4
            - name: Setup
              shell: bash
              run: |
                VERSION="${{ env.HDF5_VERSION }}"
                DL_URL="https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.14/hdf5-${{ env.HDF5_VERSION }}/bin/windows/hdf5-${{ env.HDF5_VERSION }}-Std-win10_64-vs16.zip"
                # Download and extract HDF5
                curl -L -o hdf5.zip "${DL_URL}"
                unzip hdf5.zip
                echo "HDF5_DIR=C:\\Program Files\\HDF_Group\\HDF5\\${{ env.HDF5_VERSION }}" >> $GITHUB_ENV
                echo "C:\\Program Files\\HDF_Group\\HDF5\\${{ env.HDF5_VERSION }}\\bin" >> $GITHUB_PATH

            - name: Install hdf5
              shell: pwsh
              run: |
                cd hdf
                msiexec /i HDF5-1.14.0-win64.msi /quiet /qn /norestart

            - name: build WITH hdf5
              run: cargo build --target ${{ env.TARGET }} --features hdf5

            - name: Check linkage
              shell: bash
              run: |
                ldd target/${{ env.TARGET }}/debug/hdf5-static-linking.exe
                ldd target/${{ env.TARGET }}/debug/hdf5-static-linking.exe | grep --invert-match hdf5

    build-macos:
        runs-on: macos-latest
        env:
            RUSTFLAGS: "--codegen target-feature=+crt-static"
            TARGET: "x86_64-apple-darwin"
        steps:
        - uses: actions/checkout@v4
        - name: Setup
          run: rustup target add x86_64-apple-darwin

        - name: build without hdf5
          run: cargo build --target ${{ env.TARGET }}

        - name: Check linkage
          shell: bash
          run: otool -L target/${{ env.TARGET }}/debug/hdf5-static-linking
        
        - name: build WITH hdf5
          run: cargo build --target ${{ env.TARGET }} --features hdf5
        
        - name: Check linkage
          shell: bash
          run: |
            otool -L target/${{ env.TARGET }}/debug/hdf5-static-linking
            otool -L target/${{ env.TARGET }}/debug/hdf5-static-linking | grep --invert-match hdf5
