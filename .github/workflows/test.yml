
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["trunk"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: debug

jobs:
    build-linux-musl:
        runs-on: ubuntu-latest
        env:
            RUSTFLAGS: "--codegen target-feature=+crt-static"
            TARGET: "x86_64-unknown-linux-musl"
        steps:
            - uses: actions/checkout@v4
            - name: Setup
              run: |
                rustup target add ${{ env.TARGET }}
                sudo apt-get update
                sudo apt-get install musl-tools

            - name: build without hdf5
              run: cargo build --target ${{ env.TARGET }}

            - name: Check linkage
              run: ldd target/${{ env.TARGET }}/debug/hdf5-static-linking
            
            - name: build WITH hdf5
              run: cargo build --target ${{ env.TARGET }} --features hdf5
            
            - name: Check linkage
              run: |
                ldd target/${{ env.TARGET }}/debug/hdf5-static-linking
                ldd target/${{ env.TARGET }}/debug/hdf5-static-linking | grep statically


    build-windows:
        runs-on: windows-latest
        env:
            RUSTFLAGS: "--codegen target-feature=+crt-static"
            TARGET: "x86_64-pc-windows-msvc"
        steps:
            - uses: actions/checkout@v4
            - name: build without hdf5
              run: cargo build --target ${{ env.TARGET }}
            
            - name: Check linkage
              shell: bash
              run: ldd target/${{ env.TARGET }}/debug/hdf5-static-linking.exe
            
            - name: build WITH hdf5
              run: cargo build --target ${{ env.TARGET }} --features hdf5
            
            - name: Check linkage
              shell: bash
              run: |
                ldd target/${{ env.TARGET }}/debug/hdf5-static-linking.exe
                ldd target/${{ env.TARGET }}/debug/hdf5-static-linking.exe | grep statically

    build-macos:
        runs-on: macos-latest
        env:
            RUSTFLAGS: "--codegen target-feature=+crt-static"
            TARGET: "x86_64-apple-darwin"
        steps:
        - uses: actions/checkout@v4
        - name: Setup
          run: rustup target add x86_64-apple-darwin

        - name: build without hdf5
          run: cargo build --target ${{ env.TARGET }}

        - name: Check linkage
          shell: bash
          run: ldd target/${{ env.TARGET }}/debug/hdf5-static-linking
        
        - name: build WITH hdf5
          run: cargo build --target ${{ env.TARGET }} --features hdf5
        
        - name: Check linkage
          shell: bash
          run: |
            ldd target/${{ env.TARGET }}/debug/hdf5-static-linking
            ldd target/${{ env.TARGET }}/debug/hdf5-static-linking | grep statically
